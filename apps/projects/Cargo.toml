[package]
name        = "projects"
description = "SpotledgerCore — Projects domain plugin (Project, Task, Timesheet…)"
version     = "0.1.0"
edition     = "2021"

[lib]
crate-type  = ["cdylib"]

# Build with: cargo build --target wasm32-wasip1 -p projects
[dependencies]
# spotledger-pdk = { path = "../../crates/spotledger-pdk" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
