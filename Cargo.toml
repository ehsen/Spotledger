[workspace]
members = [
    "crates/spotledger-core",
    "crates/spotledger-db",
    "crates/spotledger-desk",
    "crates/spotledger-geo",
    "crates/spotledger-contacts",
    "crates/spotledger-printing",
    "crates/spotledger-automation",
    "crates/spotledger-http",
    "crates/spotledger-plugins",
    # spotledger-pdk excluded: targets wasm32, needs separate cargo config
    "crates/spotledger",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["Spotledger Team"]
license     = "MIT"
repository  = "https://github.com/spotledger/spotledger"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }

# Web framework
axum         = { version = "0.8", features = ["macros"] }
tower        = "0.5"
tower-http   = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# SurrealDB official SDK v3 — remote WebSocket only (no embedded RocksDB)
surrealdb    = { version = "3" }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Config (TOML)
toml         = "0.8"

# CLI
clap         = { version = "4", features = ["derive", "env"] }

# Caching
moka         = { version = "0.12", features = ["future"] }
dashmap      = "6"

# Error handling
thiserror    = "2"
anyhow       = "1"

# Logging / tracing
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client (for proxy recorder)
reqwest = { version = "0.12", features = ["json"] }

# HTTP body utilities
http-body-util = "0.1"

# Password hashing (Frappe uses passlib pbkdf2_sha256 + argon2)
pbkdf2  = "0.12"
sha2    = "0.10"
argon2  = "0.5"
base64  = "0.22"
rand    = "0.8"
hex     = "0.4"

# Ordered maps — preserves field insertion order (important for Frappe doc serialisation)
indexmap = { version = "2", features = ["serde"] }

# Async trait support
async-trait = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Distributed type self-registration (DocType inventory)
inventory = "0.3"

# Regex (used in utils: email/phone/URL validation, strip_html)
regex = "1"

# Lazy static initialisation (used for compiled-once regex patterns)
once_cell = "1"

# Internal crates
spotledger-core        = { path = "crates/spotledger-core" }
spotledger-db          = { path = "crates/spotledger-db" }
spotledger-desk        = { path = "crates/spotledger-desk" }
spotledger-geo         = { path = "crates/spotledger-geo" }
spotledger-contacts    = { path = "crates/spotledger-contacts" }
spotledger-printing    = { path = "crates/spotledger-printing" }
spotledger-automation  = { path = "crates/spotledger-automation" }
spotledger-http        = { path = "crates/spotledger-http" }
spotledger-plugins     = { path = "crates/spotledger-plugins" }

# ── Build size / speed optimisations ────────────────────────────────────────
# Keep debug builds lean:
#   - debug = 1  →  line tables only (no variable DWARF), ~30-50% smaller binaries
#   - Dependencies compiled at opt-level=1 with no debug info — they don't need
#     stepping through; this alone can cut target/debug by 60%+.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
debug = false
