<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spotledger Form</title>
  <style>
    /* Hide the frappe navbar and sidebar — just show the form body */
    .navbar, .page-header-section { display: none !important; }
    .layout-side-section { display: none !important; }
    #body_div { padding: 0 !important; }
    body { margin: 0; overflow: auto; }
    /* Show a loading indicator while scripts are being fetched */
    #sl-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      color: #ccc;
      font: 14px/1 system-ui, sans-serif;
      z-index: 9999;
    }
    #sl-error {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: #1e1e1e;
      color: #f48771;
      font: 14px/1.5 system-ui, sans-serif;
      padding: 32px;
      z-index: 9999;
    }
  </style>
</head>
<body>
<!-- Frappe desk needs #body inside .main-section for frappe.views.Container -->
<div class="main-section">
  <header></header>
  <div id="body"></div>
  <footer></footer>
</div>
<div id="all-symbols" style="display:none"></div>
<div id="build-events-overlay"></div>
<div id="sl-loading">Loading form…</div>
<div id="sl-error"></div>

<script type="module">
(async () => {
  const loading = document.getElementById("sl-loading");
  const errBox = document.getElementById("sl-error");

  function showError(msg) {
    loading.style.display = "none";
    errBox.style.display = "flex";
    errBox.textContent = "Form load error: " + msg;
  }

  try {
    // ── 1. Parse URL params ──────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const doctype = params.get("doctype");
    const name    = params.get("name");

    if (!doctype) { showError("No doctype specified"); return; }

    // ── 2. Point the frappe router straight at our form via the URL hash ─────
    //   Frappe router reads window.location.hash (format: #Form/DocType/Name)
    const routeName = name || ("new-" + doctype.toLowerCase().replace(/\s+/g, "-") + "-1");
    window.location.hash = "Form/" + doctype + "/" + routeName;

    // ── 3. Fetch boot info from Spotledger ───────────────────────────────────
    const bootResp = await fetch("/api/method/frappe.utils.boot.get_boot_info", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
    });
    if (!bootResp.ok) { showError("boot_info HTTP " + bootResp.status); return; }
    const bootJson = await bootResp.json();

    // ── 4. Fetch asset map for hashed CSS/JS paths ───────────────────────────
    const assetsResp = await fetch("/assets/assets.json", { credentials: "include" });
    const assetsMap = assetsResp.ok ? await assetsResp.json() : {};
    const resolve = (key) => assetsMap[key] || ("/assets/frappe/js/" + key);

    // ── 5. Bootstrap window.frappe before any bundle loads ───────────────────
    window.frappe = {};
    window._version_number = "1";
    frappe.ready_events = [];
    frappe.ready = function(fn) { frappe.ready_events.push(fn); };
    window.dev_server = 0;
    window.socketio_port = null;
    window.show_language_picker = false;

    // Spotledger returns boot data flat (no "message" wrapper).
    // Fall back to bootJson.message for forward-compat if that ever changes.
    frappe.boot = bootJson.message !== undefined ? bootJson.message : bootJson;
    // Required for AssetManager.bundled_asset() — resolves lazy-loaded hashed bundle paths
    frappe.boot.assets_json = assetsMap;
    frappe.csrf_token = "spotledger-no-csrf";

    // ── 6. Inject desk CSS ────────────────────────────────────────────────────
    const deskCss = assetsMap["desk.bundle.css"] || null;
    if (deskCss) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = deskCss;
      document.head.appendChild(link);
    }

    // ── 7. Load bundles in order ─────────────────────────────────────────────
    //   libs  → jQuery + moment + Bootstrap (must be first, sets window.$)
    //   desk  → frappe core + Application class (auto-starts on DOMContentLoaded)
    //   list  → list view helpers (form sidebar needs some of these)
    //   form  → frappe.ui.form.Form
    //   controls → all field widgets
    const loadScript = (src) =>
      new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = res;
        s.onerror = () => rej(new Error("Failed to load " + src));
        document.body.appendChild(s);
      });

    for (const key of [
      "libs.bundle.js",
      "desk.bundle.js",
      "dialog.bundle.js",
      "list.bundle.js",
      "form.bundle.js",
      "controls.bundle.js",
    ]) {
      await loadScript(resolve(key));
    }

    // ── 8. Hide loading overlay — frappe Application takes it from here ──────
    loading.style.display = "none";

    // ── 9. Listen for navigate commands from the React shell (postMessage) ───
    window.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "sl:navigate") return;
      const { route } = e.data; // e.g. ["Form", "Sales Order", "SO-0001"]
      if (Array.isArray(route) && window.frappe && frappe.set_route) {
        frappe.set_route(route);
      }
    });

  } catch (err) {
    showError(err.message || String(err));
  }
})();
</script>
</body>
</html>
